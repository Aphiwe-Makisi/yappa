<ion-avatar>
  @if (userProfile && userProfile.photoURL) {
    <img [src]="userProfile.photoURL" [alt]="userProfile.displayName" />
  } @else {
    <div class="avatar-fallback">
      <b>{{ displayName() }}</b>
    </div>
  }

  @if (userProfile && userProfile.isOnline) {
    <span class="online-indicator"></span>
  }
</ion-avatar>
