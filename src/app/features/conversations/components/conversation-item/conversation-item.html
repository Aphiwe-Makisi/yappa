<ion-item  [button]="true" lines="full" (click)="openConversation()" detail="false" button class="container">
  
  <!-- Avatar -->
  <app-avatar slot="start" [userProfile]="conversation.otherUser"></app-avatar>

  <!-- Main Content -->
  <ion-label>
    <h2><strong>{{ conversation.otherUser?.displayName }}</strong></h2>
    <p class="last-message">{{ conversation.lastMessage }}</p>
  </ion-label>

  <!-- Meta Data -->
  <div slot="end" class="meta-data">
    <small>{{ conversation.lastMessageTime | chatDate }}</small>
    <ion-badge
      color="primary"
      [ngClass]="
        conversation.unreadCount && conversation.lastMessageSenderId === conversation.otherUser?.uid
          ? 'show'
          : 'hide'
      "
    >
      {{ conversation.unreadCount }}
    </ion-badge>
  </div>

</ion-item>
