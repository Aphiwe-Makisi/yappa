@let users = users$ | async;
<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Friends</ion-title>
    <ion-buttons slot="end">
      <ion-button shape="round">
        <ion-icon slot="icon-only" name="add" color="primary"></ion-icon>
      </ion-button>
      <ion-button>
        <ion-icon slot="icon-only" name="log-out-outline" color="danger"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  @for (user of users; track user.uid) {
    <ion-item
      [button]="true"
      lines="full"
      detail="false"
      button
      (click)="openOrCreateNewConversation(user.uid)"
    >
      <app-avatar slot="start" [userProfile]="user"></app-avatar>

      <ion-label>
        <h2>
          <strong>{{ user.displayName }}</strong>
        </h2>
        <p class="status">
          {{
            user.isOnline
              ? 'Online'
              : 'Last seen: ' + (user.lastSeen | firestoreDate | date: 'HH:mm')
          }}
        </p>
      </ion-label>
    </ion-item>
  }
</ion-content>
