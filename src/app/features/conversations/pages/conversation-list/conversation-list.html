<ion-header>
  <ion-toolbar>
    <ion-title>Chats</ion-title>
    <ion-buttons slot="end">
      <ion-button shape="round" (click)="navigateToFriendList()">
        <ion-icon slot="icon-only" name="add" color="primary"></ion-icon>
      </ion-button>
      <ion-button shape="round" (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline" color="danger"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
  
<ion-content>
  @let conversations = conversationsWithUsers$ | async;
  @for (conv of conversations; track conv.id) {
    <app-conversation-item [conversation]="conv"></app-conversation-item>
  }
</ion-content>
